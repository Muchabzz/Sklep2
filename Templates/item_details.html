{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="header">

    <div class="logo">
        <a href="{% url 'home' %}">
            <img src="{% static 'grafika/logo.png' %}" alt="logo">
        </a>
    </div>

    <nav class="menu">
        <a href="{% url 'home' %}">Strona główna</a>
        <a href="{% url 'kontakt' %}">Kontakt</a>

        {% if user.is_authenticated %}
            <a href="{% url 'panel' %}">
                {{ user.username }}
            </a>
        {% else %}
            <a href="{% url 'login' %}">
                Zaloguj się
            </a>
        {% endif %}
    </nav>

    <div class="koszyk">
        <a href="{% url 'cart' %}">
            <img src="{% static 'grafika/cart.png' %}" alt="koszyk">
            <span id="cart-count">{{ cart_count }}</span>
        </a>
    </div>

</header>

    <section class="details-container">

        <div class="details-box">

            {% if product.image %}
                <img src="{% static 'grafika/' %}{{ product.image }}"
                    alt="{{ product.name }}"
                    class="details-img">
            {% else %}
                <img src="{% static 'grafika/produkt1.png' %}"
                    alt="brak zdjęcia"
                    class="details-img">
            {% endif %}

            <div class="details-info">
                <h1>{{ product.name }}</h1>

                <p class="details-price">{{ product.price }} zł</p>

                <p class="details-description">
                    {{ product.description }}
                </p>

                <form method="POST" action="{% url 'add_to_cart' product.id %}" class="add-to-cart-form">
                    {% csrf_token %}
                    <button type="submit" class="btn-cart">Dodaj do koszyka</button>
                 </form>
                </a>
            </div>

        </div>

    </section>
<script>
const forms = document.querySelectorAll(".add-to-cart-form");

forms.forEach(form => {
    form.addEventListener("click", function(event) {
        event.stopPropagation();
    });

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        event.stopPropagation();

        const url = form.action;
        const csrfToken = form.querySelector("[name=csrfmiddlewaretoken]").value;
        const button = form.querySelector("button");

        fetch(url, {
            method: "POST",
            headers: {
                "X-CSRFToken": csrfToken,
                "X-Requested-With": "XMLHttpRequest"
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                button.textContent = "Dodano!";

                const cartCount = document.getElementById("cart-count");
                if (cartCount) {
                    cartCount.textContent = data.cart_count;
                }

                setTimeout(() => {
                    button.textContent = "Dodaj do koszyka";
                }, 1500);
            }
        });
    });
});
</script>
</body>
</html>
