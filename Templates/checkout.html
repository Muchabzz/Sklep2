{% load static %}

<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dane do zamówienia</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="reset-page">

<div class="reset-box">
    <a href="{% url 'home' %}">
        <img src="{% static 'grafika/logo.png' %}" class="reset-logo" alt="logo">
    </a>

    <h1>Dane do zamówienia</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Imię i nazwisko</label>
        <input type="text" name="full_name" value="{{ address.full_name }}" required>

        <label>Telefon</label>
        <input type="text" name="phone" value="{{ address.phone }}" required>

        <label>Ulica i numer</label>
        <input type="text" name="street" value="{{ address.street }}" required>

        <label>Kod pocztowy</label>
        <input type="text" name="postal_code" value="{{ address.postal_code }}" required>

        <label>Miasto</label>
        <input type="text" name="city" value="{{ address.city }}" required>

        <button type="submit">
            Złóż zamówienie
        </button>
    </form>
</div>

</body>
</html>
